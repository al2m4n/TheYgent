# Minimal single-binary Tempo for the sample stack: OTLP/gRPC in from the collector,
# local block storage in the compose volume, queried by Grafana over :3200 (in-network).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
