# The inference plane — deliberately NOT horizontally scaled. An instance pins model weights
# in memory and owns its local registry state; scale it vertically (resources below), or run
# it OUTSIDE the cluster (a Metal/CUDA host) and point THEYGENT_INFERENCE_PLANE_URL in
# theygent-config at that host instead of this Service.
apiVersion: v1
kind: Service
metadata:
  name: inference-plane
  namespace: theygent
  labels:
    app.kubernetes.io/name: inference-plane
spec:
  selector:
    app.kubernetes.io/name: inference-plane
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-plane
  namespace: theygent
  labels:
    app.kubernetes.io/name: inference-plane
spec:
  replicas: 1
  # Recreate: the state PVC is ReadWriteOnce and two instances must never share a registry.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-plane
    spec:
      # Matches the image's numeric uid/gid; fsGroup makes fresh PVCs writable (see
      # control-plane.yaml for the full rationale).
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: inference-plane
          image: theygent/inference-plane:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: theygent-config
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # CPU llama.cpp inference — generous limits help; size to the node and models.
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inference-data
