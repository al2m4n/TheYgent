name: docs

# User-docs pipeline:
#   - PRs touching the docs: strict build (broken links/nav fail the check).
#   - Pushes to main: publish a rolling "dev" version.
#   - Releases: publish the tagged version, point "latest" at it, and attach the
#     built site to the GitHub release.
# Versions are managed by mike on the gh-pages branch; the whole version tree is
# then deployed to Cloudflare Pages (secrets: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID).

on:
  pull_request:
    paths:
      - "docs/user-docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/user-docs/**"
      - ".github/workflows/docs.yml"
  release:
    types: [published]

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  # PR runs supersede each other; publish runs must never be killed mid-mike-push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; the publish job overrides with contents: write for mike.
permissions:
  contents: read

env:
  CF_PAGES_PROJECT: theygent-docs

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --project docs/user-docs mkdocs build --strict -f docs/user-docs/mkdocs.yml

  publish:
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike commits the built site to gh-pages; release upload
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # mike reads and extends the gh-pages branch history

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Configure git identity for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish rolling dev docs (push to main)
        if: github.event_name == 'push'
        # Deploy the rolling "dev" version, then make sure the site root actually
        # redirects somewhere — mike only writes the root index.html when a default
        # version is set. Once a release exists we keep the root pinned to the
        # stable "latest"; before the first release there is only "dev", so point
        # the root there instead of leaving it a 404.
        #
        # Until the first release exists, alias latest → dev: every page's canonical,
        # each sitemap, robots.txt, and llms.txt point into /latest/, so the alias must
        # resolve from the very first publish. The first real release reassigns it.
        # --alias-type=copy everywhere: mike's default symlink alias only survives the
        # wrangler upload because wrangler stat()s (rather than lstat()s) entries — an
        # accident of implementation its own symlink guard shows it does not intend.
        run: |
          uv run --project docs/user-docs mike deploy --push -F docs/user-docs/mkdocs.yml dev
          if uv run --project docs/user-docs mike list -F docs/user-docs/mkdocs.yml | grep -qw latest; then
            default=latest
          else
            uv run --project docs/user-docs mike alias --push --alias-type=copy -F docs/user-docs/mkdocs.yml dev latest
            default=latest
          fi
          uv run --project docs/user-docs mike set-default --push -F docs/user-docs/mkdocs.yml "$default"

      - name: Publish versioned docs (release)
        if: github.event_name == 'release'
        # --alias-type=copy: see the dev-publish step — /latest/ must be real files.
        run: |
          uv run --project docs/user-docs mike deploy --push --update-aliases --alias-type=copy \
            -F docs/user-docs/mkdocs.yml "${{ github.event.release.tag_name }}" latest
          uv run --project docs/user-docs mike set-default --push \
            -F docs/user-docs/mkdocs.yml latest

      - name: Check out the built version tree
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site

      - name: Attach built docs to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tar czf "theygent-docs-$TAG.tar.gz" -C "_site/$TAG" .
          gh release upload "$TAG" "theygent-docs-$TAG.tar.gz" --clobber

      - name: Strip git metadata from the deploy tree
        run: rm -rf _site/.git

      # mike owns the gh-pages root (version dirs, versions.json, the default-version
      # redirect), so domain-root files live in docs/user-docs/root/ and are injected
      # into the deploy tree here — every publish re-materializes them. Sourced from
      # origin/main (available: fetch-depth 0) rather than the checked-out ref, so a
      # release cut from an older tag still ships the current root policy files.
      # 404.html at the deployment root makes Cloudflare Pages return real 404s
      # instead of SPA-falling-back to the mike redirect page with a 200.
      - name: Add domain-root SEO files to the deploy tree
        run: |
          for f in robots.txt llms.txt 404.html; do
            git show "origin/main:docs/user-docs/root/$f" > "_site/$f"
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy _site --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true
