name: docs

# User-docs pipeline:
#   - PRs touching the docs: strict build (broken links/nav fail the check).
#   - Pushes to main: publish a rolling "dev" version.
#   - Releases: publish the tagged version, point "latest" at it, and attach the
#     built site to the GitHub release.
# Versions are managed by mike on the gh-pages branch; the whole version tree is
# then deployed to Cloudflare Pages (secrets: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID).

on:
  pull_request:
    paths:
      - "docs/user-docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/user-docs/**"
      - ".github/workflows/docs.yml"
  release:
    types: [published]

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  # PR runs supersede each other; publish runs must never be killed mid-mike-push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; the publish job overrides with contents: write for mike.
permissions:
  contents: read

env:
  CF_PAGES_PROJECT: theygent-docs

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --project docs/user-docs mkdocs build --strict -f docs/user-docs/mkdocs.yml

  publish:
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike commits the built site to gh-pages; release upload
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # mike reads and extends the gh-pages branch history

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Configure git identity for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Pushes to main no longer publish a rolling "dev" version — docs are versioned on
      # releases only, so a push just re-materializes the domain-root files and re-deploys
      # the existing published tree (below). The site root stays pinned to the stable
      # "latest" alias, which the release step sets as the default version.
      - name: Publish versioned docs (release)
        if: github.event_name == 'release'
        # --alias-type=copy: /latest/ must be real files, not a symlink — mike's default
        # symlink alias only survives the wrangler upload by accident (wrangler stat()s
        # rather than lstat()s entries), so materialize latest as copied files.
        run: |
          uv run --project docs/user-docs mike deploy --push --update-aliases --alias-type=copy \
            -F docs/user-docs/mkdocs.yml "${{ github.event.release.tag_name }}" latest
          uv run --project docs/user-docs mike set-default --push \
            -F docs/user-docs/mkdocs.yml latest

      - name: Check out the built version tree
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site

      - name: Strip git metadata from the deploy tree
        run: rm -rf _site/.git

      # mike owns the gh-pages root (version dirs, versions.json, the default-version
      # redirect), so domain-root files live in docs/user-docs/root/ and are injected
      # into the deploy tree here — every publish re-materializes them. Sourced from
      # origin/main (available: fetch-depth 0) rather than the checked-out ref, so a
      # release cut from an older tag still ships the current root policy files.
      # 404.html at the deployment root makes Cloudflare Pages return real 404s
      # instead of SPA-falling-back to the mike redirect page with a 200.
      - name: Add domain-root SEO files to the deploy tree
        run: |
          for f in robots.txt llms.txt 404.html; do
            git show "origin/main:docs/user-docs/root/$f" > "_site/$f"
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy _site --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

      # Last, and best-effort: the docs are already live on Cloudflare by this point, so a
      # transient upload 5xx (GitHub's upload service occasionally returns 503) can never
      # block publishing. Retries ride out the hiccup; a persistent failure still fails
      # the job loudly, but the site is already deployed.
      - name: Attach built docs to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tar czf "theygent-docs-$TAG.tar.gz" -C "_site/$TAG" .
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "theygent-docs-$TAG.tar.gz" --clobber; then
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in $((attempt * 15))s..." >&2
            sleep $((attempt * 15))
          done
          echo "::error::Could not attach docs asset to release $TAG after 5 attempts" >&2
          exit 1
