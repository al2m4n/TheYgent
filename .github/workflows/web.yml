name: web

# Marketing site pipeline (apps/web — a static, no-build HTML/CSS/JS site served at theygent.ai):
#   - PRs touching the site: validate that every local asset reference resolves, then deploy a
#     per-branch Cloudflare Pages *preview* so the change can be eyeballed before merge.
#   - Pushes to main: deploy the production site.
#   - Releases: re-deploy production from the tagged commit, so a release always ships
#     exactly the site state it was cut from (release events carry no path filter).
# There is no build step — the folder is uploaded as-is. Reuses the same Cloudflare Pages secrets
# as the docs pipeline (CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID); only the Pages project differs.

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  release:
    types: [published]

concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  # PR runs supersede each other; publish runs must never be killed mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deploys authenticate via the Cloudflare secrets, not GITHUB_TOKEN — nothing here
# needs a write-capable repo token.
permissions:
  contents: read

env:
  CF_PAGES_PROJECT: theygent-web
  SITE_DIR: apps/web

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No framework, no bundler — the only thing that can silently break is a relative path to a
      # local asset (logo, stylesheet, script). Fail the check if any local href/src/url() target
      # is missing, so a broken preview never merges.
      - name: Check local asset references resolve
        run: python3 .github/scripts/check_web_assets.py "$SITE_DIR"

      - name: Deploy preview to Cloudflare Pages
        # Fork PRs receive no secrets from GitHub — the asset check above still runs for
        # them, but the preview deploy would fail with an empty token, so it runs for
        # same-repo branches only. The Pages preview branch is the PR number, not the
        # head-ref name: ref names may contain shell metacharacters and this command
        # line is shell-executed inside the action.
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # npm, not the default package-manager sniff: the repo root has pnpm-lock.yaml, and
          # `pnpm add wrangler` at a pnpm workspace root fails without -w.
          packageManager: npm
          command: pages deploy ${{ env.SITE_DIR }} --project-name=${{ env.CF_PAGES_PROJECT }} --branch=pr-${{ github.event.pull_request.number }} --commit-dirty=true

  publish:
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the lastmod stamp below can read the site's real last-change date.
          fetch-depth: 0

      # Crawlers trust <lastmod> only when it is consistently accurate, so stamp it with the
      # date of the last commit that touched the site — not the wall clock, which would lie
      # on release-triggered redeploys that change nothing.
      - name: Stamp sitemap lastmod with the site's last-change date
        run: |
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>$(git log -1 --format=%cs -- "$SITE_DIR")</lastmod>|" "$SITE_DIR/sitemap.xml"

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # npm, not the default package-manager sniff — see the preview step's note.
          packageManager: npm
          command: pages deploy ${{ env.SITE_DIR }} --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

      # IndexNow tells Bing-family and other participating engines about the change within
      # minutes instead of a crawl cycle. The key is public by design: the engine verifies
      # ownership by fetching https://theygent.ai/<key>.txt, which ships with the site.
      # Push-only: IndexNow asks that only changed URLs be submitted, and release-triggered
      # redeploys change nothing.
      - name: Ping IndexNow
        if: github.event_name == 'push'
        run: |
          curl -fsS "https://api.indexnow.org/indexnow?url=https://theygent.ai/&key=2c3a1d08fc0c4282bde9e66bf199a0d2" || echo "IndexNow ping failed (non-fatal)"
