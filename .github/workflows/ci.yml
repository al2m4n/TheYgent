name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch/PR supersedes the in-flight run — cancel it instead of
# queueing behind it (the macOS integration job is slow and runner-scarce).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run JS-based actions on Node 24 (the v4/v5 actions still ship a Node 20 runtime;
# this is GitHub's documented opt-in, applied workflow-wide so we don't chase tags).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Gates PRs: lint, format, type-check (ty non-blocking), fast suite.
  fast:
    name: fast suite (gates)
    runs-on: ubuntu-latest
    env:
      # The control-plane fast suite runs against a REAL ephemeral Postgres via
      # testcontainers — ubuntu runners ship a working Docker daemon, so no
      # `services:` block is needed. Disable Ryuk: the fixture stops its own container and
      # Ryuk's reaper callback is a known source of CI flakiness.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked: fail loudly on a stale uv.lock instead of silently re-resolving to versions
      # nobody committed (the JS side already gets this via `pnpm install --frozen-lockfile`).
      - run: uv sync --locked
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: ty type-check (non-blocking)
        run: uv run ty check apps/inference-plane apps/control-plane apps/worker packages/ir packages/gateway-client
        continue-on-error: true
      - name: pytest ir (pure-unit — graph validation, content-hash, topo order)
        run: uv run --package theygent-ir pytest packages/ir/tests
      - name: pytest inference (fast suite — everything real except the weights)
        run: uv run --package theygent-inference-plane pytest apps/inference-plane/tests -m "not integration"
      - name: pytest control-plane (fast suite — real HTTP seam, fake model)
        run: uv run --package theygent-control-plane pytest apps/control-plane/tests -m "not integration"

  # Gates PRs touching the TS workspace: the IR type-drift guard + the interface SPA
  # (Biome · tsc · Vitest · build). The drift guard regenerates @theygent/ir-types from the
  # Pydantic IR and fails if the checked-in generated types moved — FE/BE IR stay in lockstep.
  # The cockpit (apps/web) has been folded into the interface and removed.
  frontend:
    name: frontend (ir-types drift + interface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # pnpm version comes from the root package.json `packageManager` field (the single pin the
      # lockfile was written with) — no second, drift-prone version here.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: regenerate ir-types from packages/ir (the source of truth)
        run: pnpm --filter @theygent/ir-types generate
      - name: type-drift guard — generated IR types must match the committed ones
        run: |
          git diff --exit-code -- packages/ir-types/src \
            || (echo "::error::packages/ir changed but ir-types was not regenerated — run 'pnpm --filter @theygent/ir-types generate' and commit." && exit 1)
          # `git diff` only sees tracked files — also fail if the generator emitted a NEW output
          # file that nobody committed (an untracked output would otherwise false-pass forever).
          untracked="$(git ls-files --others --exclude-standard -- packages/ir-types/src)"
          if [ -n "$untracked" ]; then
            echo "::error::the ir-types generator emitted new untracked files: $untracked — commit them."
            exit 1
          fi
      - name: ir-types type-check
        run: pnpm --filter @theygent/ir-types typecheck
      - name: interface — biome check
        run: pnpm --filter @theygent/interface check
      - name: interface — type-check + build
        run: pnpm --filter @theygent/interface build
      - name: interface — vitest
        run: pnpm --filter @theygent/interface test

  # Non-blocking (mirrors the ty hedge): runs the real llama-server loop against a
  # tiny GGUF. Job-level continue-on-error so a slow/flaky model fetch never blocks
  # a merge. Cache the GGUF so we don't re-download 101MB every run; the test skips
  # clean when THEYGENT_GGUF_PATH is unset (cache miss + fetch failure).
  integration:
    name: integration (non-blocking, real llama-server)
    runs-on: macos-14
    continue-on-error: true
    env:
      GGUF_DIR: ${{ github.workspace }}/.gguf-cache
      GGUF_FILE: SmolLM2-135M-Instruct-Q4_K_M.gguf
      GGUF_URL: https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf
      # Quiet brew's auto-update churn and the tap-trust hints from the runner's
      # pre-installed taps (we only need the core llama.cpp formula).
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      # macos-14 is Apple Silicon, so the MLX (Tier A) real path runs here too.
      THEYGENT_MLX_MODEL: mlx-community/Qwen2.5-0.5B-Instruct-4bit
      # The control-plane integration tests need a REAL Postgres + real migrations.
      # macOS runners have no Docker (so no testcontainers) — use a brew-installed PG over
      # a local trust-auth DSN (superuser = the `runner` OS user). Tests skip if unset.
      DATABASE_URL: postgresql+asyncpg://runner@127.0.0.1:5432/theygent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: install llama.cpp
        run: brew install llama.cpp
      - name: install mlx-lm (isolated tool, mlx_lm.server on PATH)
        run: |
          uv tool install mlx-lm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: cache tiny GGUF
        id: gguf
        uses: actions/cache@v4
        with:
          path: ${{ env.GGUF_DIR }}
          # Key pins the exact model+quant (URL-pinned); bump the suffix to refresh.
          key: gguf-smollm2-135m-q4km-v1
      - name: fetch GGUF on cache miss (best-effort)
        if: steps.gguf.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p "$GGUF_DIR"
          curl -L --fail -o "$GGUF_DIR/$GGUF_FILE" "$GGUF_URL"
      - name: cache the MLX model (HF hub)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ env.THEYGENT_MLX_MODEL }}-v1
      - name: start Postgres (brew; macOS runners have no Docker for testcontainers)
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          PGBIN="$(brew --prefix postgresql@16)/bin"
          for i in $(seq 1 30); do
            if "$PGBIN/pg_isready" -h 127.0.0.1 -q; then break; fi
            sleep 1
          done
          "$PGBIN/createdb" -h 127.0.0.1 theygent
      - name: integration tests (real llama.cpp + MLX; each skips clean if absent)
        run: |
          MODEL="$GGUF_DIR/$GGUF_FILE"
          if [ -f "$MODEL" ]; then
            export THEYGENT_GGUF_PATH="$MODEL"
          else
            echo "GGUF absent — llama.cpp integration will skip"
          fi
          # THEYGENT_MLX_MODEL is set in job env; the MLX test gates on mlx_lm.server too.
          # -p no:xdist: these spawn real llama-server/mlx_lm.server processes against a shared
          # HF cache dir and real unified memory — parallelizing them races real engine spawns,
          # not just test code (root addopts sets -n auto for the fast suite; override it here).
          uv run --package theygent-inference-plane pytest apps/inference-plane/tests -m integration -p no:xdist
      - name: integration test (control-plane -> real inference -> real MLX, cross-process)
        run: |
          # Same MLX env (THEYGENT_MLX_MODEL + mlx_lm.server on PATH); skips clean if absent.
          # The control-plane spawns the real inference plane as a subprocess and drives /runs.
          uv run --package theygent-control-plane pytest apps/control-plane/tests -m integration -p no:xdist

  # TODO: vLLM real-path job — UNVERIFIED until run on a CUDA host.
  # We don't have a CUDA runner, so this is intentionally NOT wired. To enable it,
  # add a GPU runner (self-hosted NVIDIA or a cloud GPU box) and a job like:
  #
  #   vllm-cuda:
  #     name: integration (vLLM, real CUDA)
  #     runs-on: [self-hosted, linux, gpu, cuda]   # a runner we do not have yet
  #     continue-on-error: true
  #     env:
  #       THEYGENT_VLLM_CUDA: "1"
  #       THEYGENT_VLLM_MODEL: Qwen/Qwen2.5-0.5B-Instruct
  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: astral-sh/setup-uv@v5
  #       - run: uv sync
  #       - run: pip install vllm            # CUDA build
  #       - run: uv run --package theygent-inference-plane pytest apps/inference-plane/tests -m integration
  #
  # Do NOT satisfy this with vllm-metal on a Mac runner — that is MLX underneath and
  # proves nothing about the CUDA slot (a false green; see vllm_engine.py).
