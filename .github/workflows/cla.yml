name: cla

# Gates every PR on the Contributor License Agreement: the check comments on a new
# contributor's first PR with a sentence to sign with, and the "CLA Assistant" status
# stays failing until they do. Signatures are committed to the `cla-signatures` branch
# of this repo — no external service holds them.
#
# pull_request_target is REQUIRED here (fork PRs need the write-capable token so the
# check can post its status and comment) and is safe ONLY because this workflow never
# checks out or executes PR code — keep it that way.
#
# The signature store must exist BEFORE the first PR: the pinned action cannot create
# the branch or the file itself (its missing-file recovery path is broken and upstream
# is archived, so it stays broken). The `cla-signatures` branch with
# signatures/cla.json = {"signedContributors": []} is seeded in this repo — do not
# delete it.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # commits signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/al2m4n/theygent/blob/main/CONTRIBUTOR_LICENSE_AGREEMENT.md
          branch: cla-signatures
          allowlist: al2m4n,dependabot[bot],github-actions[bot]
