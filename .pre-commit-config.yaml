# Pre-commit hooks for theygent — mirror the CI "fast" + "frontend" gates (.github/workflows/ci.yml)
# so the same checks run locally before a commit lands.
#
# All hooks are LOCAL (run via uv / pnpm) on purpose: they use the exact workspace-pinned tool
# versions (uv dependency-groups: ruff · ty   ·   pnpm: @biomejs/biome) instead of a second,
# independently-versioned copy that pre-commit would otherwise fetch and let drift.
#
# Install once:        uvx pre-commit install
# Run on all files:    uvx pre-commit run --all-files
# (or `make hooks` — see the Makefile)

repos:
  - repo: local
    hooks:
      # ── Python: Ruff (lint + format) — gates, mirrors `uv run ruff check/format --check .`.
      # `uv run --frozen`: never rewrite uv.lock mid-hook — pre-commit fails any hook whose run
      # modified files, so a bare `uv run` after a pyproject edit would trip a confusing
      # "files were modified" failure on uv.lock, not on anything ruff found. ──
      - id: ruff-check
        name: ruff check (lint, autofix)
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # ── Python: ty type-check — NON-BLOCKING, mirrors the CI §6 hedge (ty runs with
      # continue-on-error while it's in preview). The `|| true` keeps it advisory; `verbose: true`
      # is what actually surfaces the findings — pre-commit suppresses ALL output of a passing
      # hook, so without it the `|| true` would discard every diagnostic unseen. Drop the
      # `|| true` to make it a hard gate later. ──
      - id: ty
        name: ty type-check (non-blocking — CI §6 hedge)
        entry: bash -c 'uv run --frozen ty check apps/inference-plane apps/control-plane apps/worker packages/ir packages/gateway-client || true'
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
        verbose: true

      # ── TS: Biome — gates the interface SPA, mirrors `pnpm --filter @theygent/interface check`.
      # Scoped by `files:` so it only runs when that app's sources change. ──
      - id: biome-interface
        name: biome check (apps/interface)
        entry: pnpm --filter @theygent/interface check
        language: system
        files: ^apps/interface/
        pass_filenames: false
        require_serial: true

      # ── TS: tsc --noEmit — the REAL type gate (Biome is not a type checker; stack doc §6).
      # Also fires on packages/ir-types changes: the interface consumes those generated types,
      # so a type change there must type-check against the app before it lands. ──
      - id: tsc-interface
        name: tsc --noEmit (apps/interface)
        entry: pnpm --filter @theygent/interface typecheck
        language: system
        files: ^(apps/interface|packages/ir-types)/
        pass_filenames: false
        require_serial: true

      - id: tsc-ir-types
        name: tsc --noEmit (packages/ir-types)
        entry: pnpm --filter @theygent/ir-types typecheck
        language: system
        files: ^packages/ir-types/
        pass_filenames: false
        require_serial: true

      # ── IR type-drift guard — mirrors the CI frontend job: a packages/ir change must ship the
      # regenerated @theygent/ir-types in the same commit (FE/BE IR lockstep). Also fires on
      # packages/ir-types changes (the generator + pipeline live there, and a hand-edit to a
      # generated file must fail here, not first in CI). The hook regenerates; on drift it fails
      # and the regenerated files are left in the working tree ready to `git add` — BUT after a
      # failure during a PARTIAL commit, check `git status packages/ir` first: regeneration reads
      # the worktree, so untracked/unstaged IR sources leak into the output, and blindly adding it
      # would commit types that don't match the committed IR. The trailing ls-files check catches
      # a NEW generator output file, which `git diff` (tracked-only) would silently miss. ──
      - id: ir-types-drift
        name: ir-types drift guard (regenerate on packages/ir change)
        entry: bash -c 'UV_FROZEN=1 pnpm --filter @theygent/ir-types generate && git diff --exit-code -- packages/ir-types/src && test -z "$(git ls-files --others --exclude-standard -- packages/ir-types/src)"'
        language: system
        files: ^packages/(ir|ir-types)/
        pass_filenames: false
        require_serial: true
