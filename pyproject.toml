[tool.uv.workspace]
members = ["apps/*", "packages/*"]
# Non-Python workspace members are excluded: apps/interface is the SPA (pnpm), packages/ir-types
# is the generated IR types package (pnpm), and apps/web is the static marketing site (no build).
exclude = ["apps/interface", "packages/ir-types", "apps/web"]

# ── Shared toolchain config (uv · Ruff · ty) ──

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param = Depends(...)` in defaults; that is
# correct usage, not the B008 mutable-default-call footgun.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: opt-in tests that spawn a real llama-server (needs THEYGENT_GGUF_PATH + binary)",
]
# -n auto (pytest-xdist): distribute the fast suite across CPU cores. The macOS integration
# job spawns real engine processes against a shared HF cache and overrides this with -n0
# (see .github/workflows/ci.yml) — it must stay serial. (-n0, not -p no:xdist: disabling the
# plugin would unregister the -n option this line passes and abort with "unrecognized arguments: -n".)
addopts = "-n auto -m 'not integration'"
