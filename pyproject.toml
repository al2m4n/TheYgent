[tool.uv.workspace]
members = ["apps/*", "packages/*"]
# The TS workspace members (pnpm) are not Python packages: apps/interface is the SPA, and
# packages/ir-types is the generated IR types package.
exclude = ["apps/interface", "packages/ir-types"]

# ── Shared toolchain config (uv · Ruff · ty) ──

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param = Depends(...)` in defaults; that is
# correct usage, not the B008 mutable-default-call footgun.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: opt-in tests that spawn a real llama-server (needs THEYGENT_GGUF_PATH + binary)",
]
# -n auto (pytest-xdist): distribute the fast suite across CPU cores. The macOS integration
# job spawns real engine processes against a shared HF cache and overrides this with -p no:xdist
# (see .github/workflows/ci.yml) — it must stay serial.
addopts = "-n auto -m 'not integration'"
