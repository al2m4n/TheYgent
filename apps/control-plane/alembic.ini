# Alembic config for the control-plane (M4 §1.1). Alembic OWNS the schema — every
# change is a migration; tests apply `alembic upgrade head` (never create_all), so the
# migration chain is continuously exercised (§0).
#
# The DB URL is intentionally NOT set here: env.py reads DATABASE_URL from the
# environment (an async postgresql+asyncpg DSN), the same value the app uses (§1.4).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
