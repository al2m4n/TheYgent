[project]
name = "theygent-control-plane"
version = "0.1.0"
description = "theygent control-plane — the cockpit API. Owns a single run end to end over the inference HTTP seam."
requires-python = ">=3.12"
license = { text = "Sustainable Use License 1.0; see LICENSE.md" }
dependencies = [
    "theygent-gateway-client",
    # The control-plane imports the Agent Graph IR — the walker validates + executes an IRDocument.
    # The IR package stays pure (no engine SDK).
    "theygent-ir",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-ulid>=2",
    # Postgres is the control-plane store. Async engine + asyncpg driver;
    # Alembic owns the schema — no create_all anywhere, incl. tests.
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # The `http_fetch` built-in tool imports httpx directly. It was already
    # present transitively (via openai); declare it now that we depend on it at runtime.
    "httpx>=0.27",
    # The official MCP Python SDK, wrapped behind `McpClient` (mcp/client.py) — the rest of
    # the control-plane never imports `mcp` directly.
    "mcp>=1.28.1",
    # Cron parsing for the in-process schedule dispatcher. Deliberately kept
    # BEHIND the `fire()` seam / the dispatcher (dispatcher.py) so the durable worker can replace
    # the tick mechanism without an API or schema change — a light, swappable dep, not a commitment.
    "croniter>=2",
    "dbos>=1",
    # Encrypt tool/MCP secret material at rest (Fernet) behind a secret_ref, so the IR
    # carries no secret and rotation never bumps a hash (secrets.py). Present transitively (via the
    # MCP/DBOS stacks); declared now that we depend on it directly. A real KMS is the deferred upgrade.
    "cryptography>=42",
    # Retrieval storage: vector similarity lives in the SAME Postgres (pgvector), so chunks stay
    # transactional with their source rows — no second storage engine. The package is the
    # SQLAlchemy Vector type; the extension itself is created by migration 0015.
    "pgvector>=0.5.0",
    # Docs-site crawling for retrieval sources (rag/crawl.py). The beautifulsoup crawler is the
    # static-fetch default; the playwright crawler serves sources that opt into JS rendering
    # (browser binaries install on first use — `playwright install chromium`, never bundled).
    "crawlee[beautifulsoup,playwright]>=1.8.2",
    # Main-content extraction (boilerplate removal, HTML → markdown) for crawled pages.
    "trafilatura>=2.1.0",
    # Uploaded-document conversion (PDF/DOCX/PPTX/XLSX/HTML → markdown-ish text) for the
    # retrieval ingest path. Deliberately the lightweight converter: no ML weights to bundle.
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.6",
    # Generated MCP servers (mcp/generated.py): builds an in-process MCP server from a
    # user-provided OpenAPI spec (FastMCP.from_openapi + the in-memory client transport — no
    # subprocess). Apache-2.0; pins mcp>=1.24,<2 so it tracks the official SDK we already wrap.
    "fastmcp>=3.4.4",
    # GraphQL endpoint → MCP tools (mcp/generated.py): local introspection + query validation
    # for the generic introspect/run-query tool pair; the HTTP call itself goes through httpx.
    "graphql-core>=3.2.11",
    # OpenAPI documents are commonly authored as YAML — the generated-server preview fetches a
    # spec URL and must parse either form. Present transitively; declared now that we import it.
    "pyyaml>=6",
]

[project.optional-dependencies]
# Span export to the user's own collector (observability/otlp.py). Deliberately optional and
# lazily imported — the in-UI waterfall reads theygent's own span store and needs none of this;
# the settings page's export section degrades to an honest "SDK not installed" without it.
otlp = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.scripts]
theygent-control-plane = "theygent_control_plane.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theygent_control_plane"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3",
    "httpx>=0.27",
    "ruff>=0.5",
    "ty>=0.0.1a1",
    # The fast suite runs against a REAL ephemeral Postgres (never SQLite), through
    # real Alembic migrations. Needs Docker locally; skips clean when absent.
    "testcontainers[postgresql]>=4",
]

[tool.uv.sources]
theygent-gateway-client = { workspace = true }
theygent-ir = { workspace = true }
