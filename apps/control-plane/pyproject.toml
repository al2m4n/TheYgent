[project]
name = "theygent-control-plane"
version = "0.1.0"
description = "theygent control-plane — the cockpit API. Owns a single run end to end over the inference HTTP seam."
requires-python = ">=3.12"
dependencies = [
    "theygent-gateway-client",
    # The control-plane imports the Agent Graph IR — the walker validates + executes an IRDocument.
    # The IR package stays pure (no engine SDK).
    "theygent-ir",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-ulid>=2",
    # Postgres is the control-plane store. Async engine + asyncpg driver;
    # Alembic owns the schema — no create_all anywhere, incl. tests.
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # The `http_fetch` built-in tool imports httpx directly. It was already
    # present transitively (via openai); declare it now that we depend on it at runtime.
    "httpx>=0.27",
    # The official MCP Python SDK, wrapped behind `McpClient` (mcp/client.py) — the rest of
    # the control-plane never imports `mcp` directly.
    "mcp>=1.2",
    # Cron parsing for the in-process schedule dispatcher. Deliberately kept
    # BEHIND the `fire()` seam / the dispatcher (dispatcher.py) so the durable worker can replace
    # the tick mechanism without an API or schema change — a light, swappable dep, not a commitment.
    "croniter>=2",
    "dbos>=1",
    # Encrypt tool/MCP secret material at rest (Fernet) behind a secret_ref, so the IR
    # carries no secret and rotation never bumps a hash (secrets.py). Present transitively (via the
    # MCP/DBOS stacks); declared now that we depend on it directly. A real KMS is the deferred upgrade.
    "cryptography>=42",
]

[project.scripts]
theygent-control-plane = "theygent_control_plane.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theygent_control_plane"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3",
    "httpx>=0.27",
    "ruff>=0.5",
    "ty>=0.0.1a1",
    # The fast suite runs against a REAL ephemeral Postgres (never SQLite), through
    # real Alembic migrations. Needs Docker locally; skips clean when absent.
    "testcontainers[postgresql]>=4",
]

[tool.uv.sources]
theygent-gateway-client = { workspace = true }
theygent-ir = { workspace = true }
