[project]
name = "theygent-control-plane"
version = "0.1.0"
description = "theygent control-plane — the cockpit API. M3: owns a single run end to end over the inference HTTP seam."
requires-python = ">=3.12"
dependencies = [
    "theygent-gateway-client",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-ulid>=2",
]

[project.scripts]
theygent-control-plane = "theygent_control_plane.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theygent_control_plane"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "ty>=0.0.1a1",
]

[tool.uv.sources]
theygent-gateway-client = { workspace = true }
