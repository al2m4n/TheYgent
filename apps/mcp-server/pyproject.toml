[project]
name = "theygent-mcp"
version = "1.0.0"
description = "TheYgent MCP server — lets coding agents (Claude Code, Codex, OpenCode) build and run TheYgent agents, use local models, and search retrieval sources"
requires-python = ">=3.12"
license = { text = "Sustainable Use License 1.0; see LICENSE.md" }
dependencies = [
    "theygent-ir",
    "fastmcp>=3.4.10",
    "httpx>=0.27",
]

[project.scripts]
theygent-mcp = "theygent_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theygent_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3",
    "ruff>=0.5",
    "ty>=0.0.1a1",
]

[tool.uv.sources]
theygent-ir = { workspace = true }
