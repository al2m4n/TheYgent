[project]
name = "theygent-ai-gateway"
version = "0.1.0"
description = "TheYgent AI gateway — an Anthropic-Messages proxy between coding agents and their models (observer + router)"
requires-python = ">=3.12"
license = { text = "Sustainable Use License 1.0; see LICENSE.md" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theygent_ai_gateway"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "ty>=0.0.1a1",
]
