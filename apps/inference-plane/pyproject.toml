[project]
name = "theygent-inference-plane"
version = "0.1.0"
description = "theygent inference plane — engine manager + L0 gateway (LiteLLM-based)"
requires-python = ">=3.12"
dependencies = [
    "theygent-ir",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "litellm>=1.40",
    "httpx>=0.27",
    # M18: the /v1/audio/transcriptions endpoint parses a multipart upload via request.form().
    "python-multipart>=0.0.9",
    "psutil>=5.9",
    # MLX exposes no /props; the capability probe reads config.json (max context) from
    # the model repo via the HF hub cache — fetching just that file when not yet local.
    "huggingface-hub>=0.23",
]

[project.scripts]
theygent-inference-plane = "theygent_inference_plane.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theygent_inference_plane"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "ty>=0.0.1a1",
]

[tool.uv.sources]
theygent-ir = { workspace = true }
