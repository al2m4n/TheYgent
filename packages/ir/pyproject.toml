[project]
name = "theygent-ir"
version = "0.1.0"
description = "theygent Agent Graph IR — Pydantic models, single source of truth"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theygent_ir"]
