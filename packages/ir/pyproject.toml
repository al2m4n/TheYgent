[project]
name = "theygent-ir"
version = "0.1.0"
description = "theygent Agent Graph IR — Pydantic models, single source of truth"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theygent_ir"]

[dependency-groups]
# Pure-unit tests for the IR seam (content-hash determinism, graph validation, topo order).
# No DB, no HTTP — the package stays pure, so its tests do too.
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.5", "ty>=0.0.1a1"]
