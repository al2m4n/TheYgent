[project]
name = "theygent-gateway-client"
version = "0.1.0"
description = "Thin, stateless OpenAI-compatible async client for the inference-plane seam"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theygent_gateway_client"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "ty>=0.0.1a1",
]
