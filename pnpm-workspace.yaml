# pnpm workspace (theygent-stack.md §4/§6). TS apps live here; the Python apps/packages
# are governed by the uv workspace (pyproject.toml) and are ignored by pnpm (no package.json).
packages:
  - "apps/web"
  - "apps/interface"
  - "packages/ir-types"

# Native postinstall scripts we trust to run. pnpm blocks dependency build scripts by default and,
# with strictDepBuilds on, FAILS CI (ERR_PNPM_IGNORED_BUILDS) on a fresh install. pnpm 11 REMOVED
# the old `onlyBuiltDependencies` list in favour of this `allowBuilds` map — https://pnpm.io/settings.
allowBuilds:
  esbuild: true
  "@biomejs/biome": true
