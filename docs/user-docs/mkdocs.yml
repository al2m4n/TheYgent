site_name: TheYgent Docs
site_description: >-
  User documentation for TheYgent — a self-hosted, no-code, local-first platform
  for building and running AI agents on a visual canvas, with built-in local
  inference engines (llama.cpp, MLX, vLLM) or any OpenAI-compatible API.
# Pages are served under mike's version prefixes (/latest/, /v1.0.1/, …). During
# `mike deploy`, mike's plugin rewrites site_url to site_url + <version>, so site_url is the
# bare domain and the plugin's canonical_version (below) makes that suffix `latest` for every
# version: each page's canonical and sitemap entry point at its /latest/ copy, so search
# rankings and AI citations never fragment across versions. A plain `mkdocs build` (no
# mike) emits version-less canonicals — fine for previews, never deployed.
site_url: https://docs.theygent.ai/
docs_dir: content
strict: true

repo_url: https://github.com/al2m4n/TheYgent
repo_name: al2m4n/TheYgent
edit_uri: edit/main/docs/user-docs/content/

theme:
  name: material
  logo: assets/logo/theygent-mark-white.svg
  favicon: assets/logo/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search
  # site_url + canonical_version = https://docs.theygent.ai/latest/ in every deployed version.
  # Without it mike appends the version being deployed, and canonicals point at /<version>/.
  - mike:
      canonical_version: latest

# Emits llms-full.txt (every page's Markdown, in nav order) next to each built version.
hooks:
  - hooks/llms_full.py

extra:
  version:
    provider: mike
    default: latest

extra_css:
  - assets/video.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
