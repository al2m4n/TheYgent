site_name: TheYgent Docs
site_description: >-
  User documentation for TheYgent — a local-first platform for building and
  running AI agents with a visual editor and your choice of inference engine.
# The /latest/ suffix is deliberate: pages are served under mike's version prefixes
# (/latest/, /dev/, /0.x/), which mkdocs cannot see — a bare site_url makes every page
# emit a canonical (and sitemap entry) at a version-less URL that 404s. Anchoring
# site_url at the stable alias points every version's canonical at /latest/, so search
# rankings and AI citations never fragment across versions.
site_url: https://docs.theygent.ai/latest/
docs_dir: content
strict: true

repo_url: https://github.com/al2m4n/TheYgent
repo_name: al2m4n/TheYgent
edit_uri: edit/main/docs/user-docs/content/

theme:
  name: material
  logo: assets/logo/theygent-mark-white.svg
  favicon: assets/logo/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search

extra:
  version:
    provider: mike
    default: latest

extra_css:
  - assets/video.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Running TheYgent: getting-started/running.md
      - Your First Chat: getting-started/first-chat.md
      - Your First Agent: getting-started/first-agent.md
  - Samples:
      - samples/index.md
  - Concepts:
      - concepts/index.md
      - Agents & Graphs: concepts/agents-and-graphs.md
      - Nodes, Ports & Edges: concepts/nodes-ports-edges.md
      - Models & Engines: concepts/models-and-engines.md
      - Runs & Sessions: concepts/runs-and-sessions.md
      - Agent Versioning: concepts/versioning.md
  - Building Agents:
      - The Editor: building/editor.md
      - Referencing Inputs: building/input-references.md
      - Node Reference:
          - building/nodes/index.md
          - Input & Output: building/nodes/input-output.md
          - LLM: building/nodes/llm.md
          - Tools: building/nodes/tools.md
          - MCP Tools: building/nodes/mcp.md
          - RAG: building/nodes/rag.md
          - Router: building/nodes/router.md
          - Transform: building/nodes/transform.md
          - Guardrail: building/nodes/guardrail.md
          - Rate Limit & Quota: building/nodes/ratelimit-quota.md
          - Human Approval: building/nodes/human.md
          - Subgraph, Loop & Map: building/nodes/orchestration.md
          - Audio & Images: building/nodes/media.md
      - Drafts & Publishing: building/saving-agents.md
  - Chat:
      - chat/index.md
      - Voice: chat/voice.md
      - Vision & Images: chat/vision-and-images.md
  - Models:
      - models/index.md
      - Installing Local Models: models/installing.md
      - Remote Models: models/remote.md
      - Engines: models/engines.md
  - RAG:
      - rag/index.md
  - MCP:
      - mcp/index.md
      - Example agents: mcp/examples.md
  - Running Agents:
      - running/index.md
      - Durable Runs: running/durable.md
      - Human-in-the-Loop: running/human-in-the-loop.md
      - Triggers & Webhooks: running/triggers.md
      - Users, Roles & Sign-in: running/users.md
      - Observability: running/observability.md
      - The Bench: running/bench.md
  - Import & Export:
      - import-export/index.md
  - Reference:
      - API Reference: reference/api.md
      - Environment Variables: reference/environment.md
      - Glossary: reference/glossary.md
      - Troubleshooting: reference/troubleshooting.md
