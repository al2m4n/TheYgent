<!doctype html>
<!-- Deployment-root 404 for docs.theygent.ai. Served by Cloudflare Pages with a real
     404 status (its presence also disables the SPA fallback that would otherwise answer
     every missing URL with the mike redirect page and a 200). Self-contained on purpose:
     root pages cannot rely on assets inside mike's version directories. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — TheYgent Docs</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #1f2933;
        --muted: #5f6b7a;
        --accent: #2f52ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0e14;
          --text: #e8ecf5;
          --muted: #aab3c6;
          --accent: #6f88ff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 24px;
        line-height: 1.6;
      }
      a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404 — page not found</h1>
      <p>
        This page doesn&rsquo;t exist (or lives in a different docs version).
      </p>
      <p>
        <a href="https://docs.theygent.ai/latest/">Go to the latest TheYgent docs</a>
      </p>
    </main>
  </body>
</html>
